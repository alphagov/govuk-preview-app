# The GOV.UK apps that Preview App knows how to run previews for. Each app's
# image comes from ghcr.io/alphagov/govuk/<repo name> (see ImageResolver).
#
# This is a small manifest owned by Preview App itself (not a file each
# previewable app's own repo has to carry).
#
# `env` is a fixed set of extra environment variables passed to the app's
# pods - e.g. pointing a read-only dependency (frontend's Content Store
# client, via Plek) at the real GOV.UK service instead of running a preview
# of it.
#
# `dependencies` lists other apps in this manifest that must run as their
# own real, dedicated preview (never shared across parents) before this app
# starts - e.g. Whitehall needs a real, writable Publishing API, not the
# real GOV.UK one. See PreviewBuilder. Each is an `app`, plus:
#
# - `full_stack_mode_only` (default false): only started when a preview
#   asks for its full stack (Preview#full_stack). For seeing an app's
#   output end to end (e.g. Whitehall's Frontends, to view published and
#   draft pages; or Publishing API's Content Stores), never for something
#   the app interacts with directly: e.g. Publishing API always runs with
#   Whitehall, since its responses (validation errors and all) are part of
#   what a Whitehall preview is for. Otherwise, the app is pointed at a
#   stand-in that accepts and discards everything instead
#   (kubernetes/previews/sink.yaml).
# - `include_its_full_stack_dependencies_when_running_in_full_stack_mode`
#   (default false): in a full stack, also start this dependency's own
#   `full_stack_mode_only` dependencies - e.g. Whitehall's Publishing API's
#   Content Stores, for its Frontends to read. Otherwise they're pointed at
#   the sink: e.g. Whitehall's Frontend is only there to view published
#   pages, so doesn't start its postcode lookups (Locations API, Local
#   Links Manager and Places Manager). To try those, preview Frontend's own
#   full stack.
#
# Order matters: each dependency can see the resolved PLEK_SERVICE_*_URI of
# every dependency declared *before* it in the same list (so Whitehall's
# `frontend` dependency, declared after `publishing-api`, inherits the real
# local Content Store address that publishing-api's own `content-store`
# dependency resolved - not frontend's own static, real-GOV.UK default
# below).
#
# `database` declares the database this app needs (one per preview, never
# shared - see KubernetesDatabaseRunner). Omit entirely for apps with no database (e.g.
# frontend).
#
# `setup_tasks` names `bin/rails` tasks to run, in order, as one-off
# Kubernetes Jobs after the database is seeded and before the app starts -
# e.g. Whitehall needs a basic taxonomy in Publishing API before a document
# can be tagged to a topic, the same way govuk-docker's own Makefile sets
# this up (see projects/whitehall/Makefile). A failing task fails the
# preview, with the task's error as its status message (see
# PreviewBuilder).
#
# `worker_command` starts a second, long-running Deployment from the same
# image (e.g. Publishing API's Sidekiq worker, which actually pushes
# published content downstream to Content Store - without it, nothing
# ever leaves Publishing API's own database). See KubernetesRunner#start_worker!.
#
# `publicly_readable: true` makes a *dependency* preview reachable at a
# short, randomised hostname (e.g. content-store-mvym1ob...) instead of its
# full, dependency-chain-shaped slug - see HostRouter and
# Preview#generate_public_hostname. Only for read-only, non-state-mutating
# APIs. Has no effect on a preview with no parent (a standalone top-level
# preview already gets a perfectly good, readable hostname from its slug).
#
# `env_aliases` re-exposes one of the dependency addresses this app has
# been given, inherited or its own, under a different env var key, for its
# own pods only (not propagated to siblings/the parent) - see
# PreviewBuilder#build!. Only applied when that address exists - e.g. only
# in a full stack, for `full_stack_mode_only` dependencies. Needed when an
# app's own code reads a fixed env var name, whichever instance it should
# talk to: e.g. draft-frontend is the same codebase as frontend, which only
# ever reads PLEK_SERVICE_CONTENT_STORE_URI (never the draft one); and
# Whitehall builds its "View on website"/"Preview on website" links from
# GOVUK_WEBSITE_ROOT and PLEK_SERVICE_DRAFT_ORIGIN_URI.
#
# `memory` sets what each of the app's pods (web, worker and one-off tasks)
# requests and is limited to - and `database: memory:`, its database's.
# Requests are what Kubernetes schedules by and charges the previews quota
# for, so they're sized from real usage (bin/preview-usage): roughly 25%
# above what a lightly-used preview of the app uses once booted. Limits
# leave 2-3x headroom for boot and spikes. Apps without one get a generous
# default (see KubernetesRunner.memory_for) until they've been measured.
#
# `shared_volumes` are directories an app's web and worker processes both
# need - e.g. Whitehall's web process saves an upload that its worker then
# sends to Asset Manager. An app with any runs its worker as a second
# container in its web pod (see KubernetesRunner), with each one mounted at
# `path` in both. They start empty, and are lost when the preview is put to
# sleep - unless `persistent: true`, which keeps one on a volume of its own
# (`size`, default 1Gi) until the preview is deleted.
#
# `self_url_env` names env vars to set to the preview's own public URL - see
# PreviewEnv.
#
# `public_paths` limits a `publicly_readable` dependency's public hostname to
# GET and HEAD requests for paths starting with one of these - e.g. Asset
# Manager's assets, but not its API (see HostRouter).
#
# `resync_tasks` names `bin/rails` tasks to run when a running preview is
# switched to the full stack - e.g. re-sending everything Publishing API
# holds to the Content Stores that have just been added.
#
# collections, feedback, finder-frontend, govuk-content-publishing-guidance,
# govuk-publishing-components and smart-answers previously only got a
# Heroku review app (see docs.publishing.service.gov.uk/manual/review-apps.html)
# - plain, dependency-free previews, same pattern as frontend. None of these
# publish a per-branch image to GHCR yet (govuk_publishing_components and
# govuk-content-publishing-guidance don't even have a Dockerfile/CI image at
# all - see each one's own comment), so a preview of any of them sits in
# waiting_for_image until either that's fixed, or it's previewed from a
# local checkout via bin/preview-build.

# Whitehall's uploads (e.g. a news story's lead image) - a stack's own,
# instead of the real Asset Manager on integration. GOV.UK's real one serves
# draft assets only from a separate, signed-in draft-assets host; here there's
# one host, which serves every asset whether it's draft or not. Whether a
# draft is visible is down to Publishing API and the Content Stores anyway -
# an asset is only linked to from the pages that use it.
asset-manager:
  memory:
    request: 176Mi
    limit: 512Mi
  repo_url: https://github.com/alphagov/asset-manager.git
  port_env_var: PORT
  publicly_readable: true
  # Assets (/media/...), and where Asset Manager redirects to for their files
  # (/fake-s3/... - see below). Not its API, which changes things. /auth/gds
  # is its own real-Signon-via-Preview-App login (see PreviewSignon) -
  # MediaController redirects a browser there itself (gds-sso's own Warden
  # config) for a draft asset (e.g. one still being edited in Whitehall's
  # crop tool) it isn't already signed in to view - without this, that
  # redirect 404s here before ever reaching Asset Manager.
  public_paths:
    - /media/
    - /fake-s3/
    - /auth/gds
  database:
    adapter: mongodb
    image: mongo:7.0
    memory:
      request: 112Mi
      limit: 384Mi
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  # The web process saves each upload to GOVUK_UPLOADS_ROOT, and the worker
  # scans it and copies it to fake-s3 (see below), where the web process
  # then serves it from. The fake-s3 copy is the only lasting one, so it has
  # to outlive the preview being put to sleep. Its path is fixed in Asset
  # Manager's code (lib/fake_s3_configuration.rb).
  shared_volumes:
    uploads:
      path: /uploads
    fake-s3:
      path: /app/fake-s3
      persistent: true
  # GOVUK_ASSET_ROOT is where its API says assets are. FAKE_S3_HOST is where
  # it sends browsers for an asset's file. PLEK_SERVICE_DRAFT_ASSETS_URI makes
  # its own public hostname its draft assets host, so it serves draft assets
  # there instead of redirecting them to a draft-assets host that doesn't
  # exist.
  self_url_env:
    - GOVUK_ASSET_ROOT
    - FAKE_S3_HOST
    - PLEK_SERVICE_ASSETS_URI
    - PLEK_SERVICE_DRAFT_ASSETS_URI
  env:
    GOVUK_UPLOADS_ROOT: /uploads
    # Stores files on disk, not in S3 - Asset Manager's own option for
    # end-to-end tests (lib/s3_configuration.rb).
    ALLOW_FAKE_S3_IN_PRODUCTION_FOR_PUBLISHING_E2E_TESTS: "true"
    # Treats every file as virus-free, so it needs no ClamAV - the same as
    # govuk-docker.
    ASSET_MANAGER_CLAMSCAN_PATH: /bin/true
    # Not a real secret - boot fails without one (config/application.rb).
    JWT_AUTH_SECRET: preview-jwt-secret

collections:
  repo_url: https://github.com/alphagov/collections.git
  port_env_var: PORT
  env:
    GOVUK_APP_DOMAIN: www.gov.uk
    GOVUK_WEBSITE_ROOT: https://www.gov.uk
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api
    PLEK_SERVICE_SEARCH_API_URI: https://www.gov.uk/api

# Not run alongside it (so those features won't work in a preview): Link
# Checker API. Reads published content from the real GOV.UK Content Store.
collections-publisher:
  repo_url: https://github.com/alphagov/collections-publisher.git
  port_env_var: PORT
  database:
    adapter: mysql2
    image: mysql:8
  dependencies:
    - app: publishing-api
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  env:
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api

content-store:
  memory:
    request: 160Mi
    limit: 512Mi
  repo_url: https://github.com/alphagov/content-store.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:17
    memory:
      request: 48Mi
      limit: 256Mi
  publicly_readable: true

draft-content-store:
  memory:
    request: 160Mi
    limit: 512Mi
  repo_url: https://github.com/alphagov/content-store.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:17
    memory:
      request: 48Mi
      limit: 256Mi
  publicly_readable: true

draft-frontend:
  memory:
    request: 176Mi
    limit: 512Mi
  repo_url: https://github.com/alphagov/frontend.git
  port_env_var: PORT
  publicly_readable: true
  env_aliases:
    PLEK_SERVICE_CONTENT_STORE_URI: PLEK_SERVICE_DRAFT_CONTENT_STORE_URI
  env:
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api
    # Purely cosmetic - frontend's own draft_helper.rb/layouts_helper.rb use
    # this solely to show a "draft" watermark banner; no effect on content
    # lookup (see env_aliases above for how that's actually wired).
    PLEK_HOSTNAME_PREFIX: "draft-"

feedback:
  repo_url: https://github.com/alphagov/feedback.git
  port_env_var: PORT
  env:
    GOVUK_APP_DOMAIN: www.gov.uk
    GOVUK_WEBSITE_ROOT: https://www.gov.uk
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api

finder-frontend:
  repo_url: https://github.com/alphagov/finder-frontend.git
  port_env_var: PORT
  env:
    GOVUK_APP_DOMAIN: www.gov.uk
    GOVUK_WEBSITE_ROOT: https://www.gov.uk
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api
    PLEK_SERVICE_SEARCH_API_URI: https://www.gov.uk/api
    PLEK_SERVICE_WHITEHALL_FRONTEND_URI: https://www.gov.uk

frontend:
  memory:
    request: 176Mi
    limit: 512Mi
  repo_url: https://github.com/alphagov/frontend.git
  port_env_var: PORT
  publicly_readable: true
  # For its postcode pages (local transactions, licences, find your
  # council, find nearest places). Places Manager comes last, so it's
  # pointed at the other two as well.
  dependencies:
    - app: locations-api
      full_stack_mode_only: true
    - app: local-links-manager
      full_stack_mode_only: true
    - app: places-manager
      full_stack_mode_only: true
  env:
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api

govuk-content-publishing-guidance:
  repo_url: https://github.com/alphagov/govuk-content-publishing-guidance.git
  port_env_var: PORT

# Named with hyphens, not the repo's own underscores - Kubernetes object
# names (ConfigMaps, Services, etc.) can't contain underscores, and every
# other manifest key already uses hyphens; the manifest key is just a
# lookup string, decoupled from repo_url.
govuk-publishing-components:
  repo_url: https://github.com/alphagov/govuk_publishing_components.git
  port_env_var: PORT
  env:
    GOVUK_WEBSITE_ROOT: https://www.gov.uk
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api
    PLEK_SERVICE_RUMMAGER_URI: https://www.gov.uk/api
    # Not in app.json - only in its Procfile. Without this, spec/dummy boots
    # but serves its own default behaviour instead of the actual component
    # guide UI.
    MAIN_COMPONENT_GUIDE: "true"
    # spec/dummy isn't a deployed app with its own asset:precompile step -
    # on Heroku that happens automatically as part of the buildpack's slug
    # compile. Locally (bin/preview-build) there's no such step, so it has
    # to serve assets live via Sprockets, which only happens outside
    # RAILS_ENV=production (confirmed directly: production raises
    # LoadError (sassc)/missing-manifest errors instead).
    RAILS_ENV: development
    RACK_ENV: development

# Local authorities and their links to council services, for Frontend and
# Places Manager. Only its local authorities are imported (from a CSV in
# its own repo) - its services and links come from external sites and
# Publishing API, so pages that need a council's link for a service find
# none.
local-links-manager:
  repo_url: https://github.com/alphagov/local-links-manager.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:18
  setup_tasks:
    - import:local_authorities:import_all
  env:
    # Saving a local authority publishes it to Publishing API, which isn't
    # run alongside it. Without this, the import stops at the first one -
    # quietly, as it logs the error rather than failing.
    PLEK_SERVICE_PUBLISHING_API_URI: http://sink

# Postcode lookups, for Frontend and Places Manager. Only knows the
# postcodes its seeds create (E1 8QS, WV14 8TU, AL1 1HE and AL1 1AA) - any
# other is looked up in OS Places, which needs credentials it doesn't
# have here. Its worker only refreshes postcodes from OS Places and ONS
# imports, so it isn't run.
locations-api:
  repo_url: https://github.com/alphagov/locations-api.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:18

# Not run alongside it (so those features won't work in a preview): Asset
# Manager (attachments) and Link Checker API.
manuals-publisher:
  repo_url: https://github.com/alphagov/manuals-publisher.git
  port_env_var: PORT
  database:
    adapter: mongodb
    image: mongo:7.0
  dependencies:
    - app: publishing-api
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]

places-manager:
  memory:
    request: 224Mi
    limit: 512Mi
  repo_url: https://github.com/alphagov/places-manager.git
  port_env_var: PORT
  publicly_readable: true
  database:
    # postgis/postgis has no arm64 image; this is a multi-arch build of it.
    # Not kartoza/postgis, as govuk-docker uses: its entrypoint needs root,
    # and its own env vars for the database, user and data directory.
    adapter: postgis
    image: imresamu/postgis:18-3.6
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  env:
    # As for Whitehall and Publisher: without this, its session cookie is
    # marked `secure` in production, so it's never set over our plain-HTTP
    # entry point and every admin form submission (e.g. creating a
    # service) fails CSRF verification.
    DISABLE_SECURE_COOKIES: "1"
    GOVUK_WEBSITE_ROOT: https://www.gov.uk
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api
    PLEK_SERVICE_SEARCH_API_URI: https://www.gov.uk/api

# Mainstream Publisher. Not run alongside it (so those features won't work
# in a preview): Link Checker API.
publisher:
  repo_url: https://github.com/alphagov/publisher.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:17
  dependencies:
    - app: publishing-api
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  env:
    # As for Whitehall: without this, Publisher's session cookie is marked
    # `secure` in production, so no browser keeps it over our plain-HTTP
    # entry point and every form submission fails CSRF verification.
    DISABLE_SECURE_COOKIES: "1"
    # Not a real secret - Publisher signs its draft preview links with this
    # (PathsHelper#jwt_token), and creating an edition crashes without one.
    JWT_AUTH_SECRET: preview-jwt-secret
    # Publisher emails alert groups via GOV.UK Notify on every edition
    # action (EventNotifierService), and with no real Notify API key that
    # crashes - e.g. creating an edition fails. Its production.rb turns off
    # delivery when this is set, so no email is ever sent from a preview.
    DISABLE_EMAIL: "1"

publishing-api:
  memory:
    request: 288Mi
    limit: 768Mi
  repo_url: https://github.com/alphagov/publishing-api.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:17
    memory:
      request: 48Mi
      limit: 256Mi
  dependencies:
    - app: content-store
      full_stack_mode_only: true
    - app: draft-content-store
      full_stack_mode_only: true
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  resync_tasks:
    - represent_downstream:all
  env:
    # The queue publisher broadcasts over RabbitMQ to third-party downstream
    # consumers (e.g. search-api, email-alert-api) - a separate mechanism
    # from the Sidekiq worker's own HTTP push straight to Content Store, and
    # there's no RabbitMQ here for it to connect to.
    DISABLE_QUEUE_PUBLISHER: "1"

# Has no background worker.
service-manual-publisher:
  repo_url: https://github.com/alphagov/service-manual-publisher.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:17
  dependencies:
    - app: publishing-api

short-url-manager:
  repo_url: https://github.com/alphagov/short-url-manager.git
  port_env_var: PORT
  database:
    adapter: mongodb
    image: mongo:7.0
  dependencies:
    - app: publishing-api
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]

smart-answers:
  repo_url: https://github.com/alphagov/smart-answers.git
  port_env_var: PORT
  env:
    GOVUK_APP_DOMAIN: www.gov.uk
    GOVUK_WEBSITE_ROOT: https://www.gov.uk
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api

# Not run alongside it (so those features won't work in a preview): Asset
# Manager (attachments) and Email Alert API.
specialist-publisher:
  repo_url: https://github.com/alphagov/specialist-publisher.git
  port_env_var: PORT
  database:
    adapter: mysql2
    image: mysql:8
  dependencies:
    - app: publishing-api
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  env:
    # Its production config refuses to boot without a GOV.UK Notify key.
    # This is a dummy in Notify's format, so no email is ever actually sent.
    GOVUK_NOTIFY_API_KEY: preview-00000000-0000-0000-0000-000000000000-00000000-0000-0000-0000-000000000000
    # Its seeds (which create the user that mock sign-in needs) only run in
    # production when asked to - as for its Heroku review apps.
    RUN_SEEDS_IN_PRODUCTION: "true"

# Has no database - it keeps signed-in users in Redis. Not run alongside it
# (so those features won't work in a preview): Support API, which every
# request form (via Zendesk) and the feedback explorer go through - so it
# has no worker either, as its only job sends requests on to Support API.
support:
  repo_url: https://github.com/alphagov/support.git
  port_env_var: PORT
  env:
    # As for Whitehall, Publisher and Places Manager: without this, its
    # cookies are marked `secure` (by force_ssl, in its case), so its session
    # is never kept over our plain-HTTP entry point and every form
    # submission fails CSRF verification.
    DISABLE_SECURE_COOKIES: "1"
    # Most of its pages (all of AuthorisationController's) fail without
    # this. Dummy details, the same as its own development ones
    # (config/emergency_contact_details.json).
    EMERGENCY_CONTACT_DETAILS: |
      {
        "current_at": "2014-07-01",
        "primary_contacts": {
          "national_emergencies": {
            "phone": "0555 555 555"
          },
          "major_technical_problems": {
            "phone": "05555 555 555"
          },
          "urgent_mainstream_content_change": {
            "phone": "05555 555 555"
          },
          "content_emergency": {
            "email": "idasupport@email.uk"
          }
        },
        "secondary_contacts": [
          {
            "name": "Billy Director",
            "role": "Director",
            "phone": "05555 555 555",
            "email": "billy.director@email.uk"
          },
          {
            "name": "Bob Manager",
            "role": "Manager",
            "phone": "05555 555 556",
            "email": "bob.manager@email.uk"
          }
        ],
        "verify_contacts": {
          "ida_support_email": "idasupport@email.uk",
          "out_of_hours_email": "outofhours@email.uk"
        }
      }

# Support's backend: anonymous feedback, organisations, and raising Zendesk
# tickets. Not run alongside it (so those features won't work in a
# preview): S3 and GOV.UK Notify, which feedback CSV exports need. Has no
# worker: its jobs only handle feedback sent by the Feedback app (not run
# alongside it either) and those exports.
support-api:
  repo_url: https://github.com/alphagov/support-api.git
  port_env_var: PORT
  database:
    adapter: postgresql
    image: postgres:17
  # Organisations from the real GOV.UK (see GOVUK_WEBSITE_ROOT) - e.g. for
  # Support's organisation dropdowns.
  setup_tasks:
    - api_sync:import_organisations
  env:
    # Logs each ticket instead of raising it with GOV.UK's real Zendesk -
    # needs alphagov/support-api's own escape hatch.
    DISABLE_ZENDESK: "1"
    # Where its Organisations API is (GdsApi.organisations), and the site its
    # feedback's links point at - the same content as the real GOV.UK
    # Content Store it reads.
    GOVUK_WEBSITE_ROOT: https://www.gov.uk
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api

# Not run alongside it (so those features won't work in a preview): Asset
# Manager (attachments). Reads published content from the real GOV.UK
# Content Store.
travel-advice-publisher:
  repo_url: https://github.com/alphagov/travel-advice-publisher.git
  port_env_var: PORT
  database:
    adapter: mongodb
    image: mongo:7.0
  dependencies:
    - app: publishing-api
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  env:
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api

whitehall:
  memory:
    request: 288Mi
    limit: 768Mi
  repo_url: https://github.com/alphagov/whitehall.git
  port_env_var: PORT
  database:
    adapter: mysql2
    image: mysql:8
    memory:
      request: 224Mi
      limit: 512Mi
  dependencies:
    - app: publishing-api
      # For its Content Stores, which its Frontends read.
      include_its_full_stack_dependencies_when_running_in_full_stack_mode: true
    - app: asset-manager
      full_stack_mode_only: true
    - app: frontend
      full_stack_mode_only: true
    - app: draft-frontend
      full_stack_mode_only: true
  # In a full stack, link "View on website"/"Preview on website" (and every
  # other public link Whitehall builds) to this preview's own Frontends, and
  # build asset URLs (e.g. a lead image's) from its own Asset Manager.
  # Otherwise they stay pointing at the real integration site. (In a core
  # stack, uploads go to the sink, so they never finish processing.)
  env_aliases:
    GOVUK_WEBSITE_ROOT: PLEK_SERVICE_FRONTEND_PUBLIC_URL
    PLEK_SERVICE_DRAFT_ORIGIN_URI: PLEK_SERVICE_DRAFT_FRONTEND_PUBLIC_URL
    GOVUK_ASSET_ROOT: PLEK_SERVICE_ASSET_MANAGER_PUBLIC_URL
  # Where uploads wait for the worker to send them to Asset Manager.
  shared_volumes:
    uploads:
      path: /uploads
  setup_tasks:
    - taxonomy:populate_end_to_end_test_data
    - taxonomy:rebuild_cache
  # Whitehall does much of its work in Sidekiq jobs - including sending
  # changes to Publishing API (e.g. PresentPageToPublishingApiJob) - so
  # without a worker those would just queue up and never run.
  worker_command: ["bundle", "exec", "sidekiq", "-C", "./config/sidekiq.yml"]
  env:
    PLEK_SERVICE_CONTENT_STORE_URI: https://www.gov.uk/api
    # Not a real secret - Whitehall's own boot aborts without one at all
    # (config/initializers/secrets_to_credentials.rb raises if unset); its
    # own Dockerfile sets an equally dummy value at build time for the same
    # reason ("unused_yet_required").
    JWT_AUTH_SECRET: preview-jwt-secret
    # Whitehall's session_store.rb marks its session cookie `secure: true`
    # unless this is set (its own escape hatch, mirroring RAILS_ENV=test/
    # development) - RAILS_ENV=production here, but our nginx has no TLS in
    # front of it, so a Secure-flagged cookie would never be stored/sent by
    # any browser, meaning sessions (and CSRF token verification) silently
    # never persist across requests. Any truthy value works.
    DISABLE_SECURE_COOKIES: "1"
    GOVUK_UPLOADS_ROOT: /uploads
